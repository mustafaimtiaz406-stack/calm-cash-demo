<style>

</style></head><body>
<header><b>🪺 Calm Cash <span class="dbadge">Free demo</span></b><button class="s" onclick="theme()">◐ Theme</button></header>
<div id="demo"></div><nav id="nav"></nav><main id="v"></main>
<script>
/* ===== FREE DEMO CONFIG =====
   Replace YOUR_ETSY_LISTING_URL with your full Etsy listing link (must start with https://).

const ETSY_URL='https://www.etsy.com/listing/4595716822/adhd-budget-planner-web-app-spending?ref=listings_manager_table',ETSY_OK=/^https:\/\//.test(ETSY_URL),DEMO_LIMIT=20;
function demoSeed(){const D=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
bill=(id,name,amt,o,f,kind,cat)=>{const due=D(o);return{id,name,amt,due,f,kind,cat,note:kind=='sub'?'':undefined,dom:+due.slice(8,10),paid:false}},

return{bal:[{id:1,name:'Everyday account',inc:true,amt:2480.5},{id:2,name:'Savings account',inc:false,amt:3200}],
exp:[ex(101,0,4.8,'Eating out','Coffee with a friend'),ex(102,-1,62.35,'Groceries','Weekly shop'),ex(103,-2,25,'Transport','Bus pass top-up'),ex(104,-3,14.99,'Shopping','Paperback'),ex(105,-4,18,'Fun','Cinema'),ex(106,-5,48.1,'Groceries','Market'),ex(107,-6,20,'Other','Birthday gift')],
bills:[bill(201,'Rent',950,3,'monthly','bill'),bill(202,'Phone plan',35,8,'monthly','bill'),bill(203,'Streaming subscription',12.99,5,'monthly','sub','Subscriptions'),bill(204,'Gym membership',29,10,'monthly','sub','Fun'),bill(205,'Car insurance',180,20,'quarterly','bill')],

pause:[{id:501,name:'Wireless headphones',price:129,why:'Mine still work, I just like the new colour',t:now-20*36e5,st:'open'},{id:502,name:'Air fryer',price:89,why:'Saw it in an ad',t:now-5*864e5,st:'let go'},{id:503,name:'Running shoes',price:75,why:'Old pair is worn through',t:now-9*864e5,st:'bought'}],
dump:[{id:601,t:'Check if the gym has a cheaper off-peak plan'},{id:602,t:'Ask about sharing the streaming plan'},{id:603,t:'Return the shirt before Friday'}],
payday:D(12),buf:100,cur:'$',
debts:[{id:701,name:'Credit card',bal:1240,orig:2000,rate:19.9,min:45,pay:100,next:D(9),hist:[D(-21)+' paid $100.00']}],
categoryBudgets:[{id:801,cat:'Groceries',limit:400},{id:802,cat:'Eating out',limit:120},{id:803,cat:'Fun',limit:80}],

const K='calmcash_demo',CATS=['Groceries','Eating out','Transport','Shopping','Subscriptions','Bills','Fun','Other'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
function mig(o){const d={bal:[{id:1,name:'Main account',inc:true,amt:0}],exp:[],bills:[],inc:[],goals:[],pause:[],dump:[],payday:'',buf:0,cur:'$',debts:[],categoryBudgets:[]};
for(const k in d)if(o[k]===undefined||o[k]===null||(Array.isArray(d[k])&&!Array.isArray(o[k])))o[k]=d[k];return o}
S=mig(S&&typeof S=='object'&&!Array.isArray(S)?S:demoSeed());
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),val=i=>$(i).value,num=i=>parseFloat(val(i))||0,uid=()=>Date.now()+Math.random();
const amt=id=>{const s=val(id).trim(),x=s===''?NaN:Number(s);
if(!Number.isFinite(x)){alert('Please enter an amount as a number, for example 12.50.');return null}
if(x<0){alert('Amounts can’t be negative. Enter a positive number: the button or section you use decides whether money is added or taken away.');return null}
if(x===0){alert('Please enter an amount above 0.');return null}
if(x>MAX_AMT){alert('Please enter an amount of '+S.cur+'1,000,000,000 or less. Nothing was saved.');return null}
return x},MAX_AMT=1e9;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isD=s=>{if(typeof s!='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const[y,mo,d]=s.split('-').map(Number),t=new Date(Date.UTC(y,mo-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===mo-1&&t.getUTCDate()===d},curOk=s=>typeof s=='string'&&/^(?=.*[\p{L}\p{Sc}])[\p{L}\p{Sc}. ]{1,4}$/u.test(s);
const m=n=>(n<0?'-':'')+esc(S.cur)+Math.abs(n).toFixed(2),td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const days=()=>S.payday?Math.max(1,Math.ceil((new Date(S.payday)-new Date(td()))/864e5)):30;
const first=()=>S.bal.find(a=>a.inc)||S.bal[0];
function theme(){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function calc(){const bal=S.bal.filter(a=>a.inc).reduce((s,a)=>s+a.amt,0),d=days(),
bills=S.bills.filter(b=>!b.paid&&(!S.payday||b.due<=S.payday)).reduce((s,b)=>s+b.amt,0),
prot=S.goals.filter(g=>g.hide).reduce((s,g)=>s+g.saved,0),buf=Math.max(0,S.buf),safe=bal-bills-prot-buf;return{bal,bills,prot,buf,safe,d,per:safe/d,past:!!S.payday&&S.payday<td()}}
function nextDue(s,f,dom){if(f=='weekly'||f=='fortnight'){const p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+(f=='weekly'?7:14))).toISOString().slice(0,10)}const d=new Date(s);if(f=='yearly')d.setMonth(d.getMonth()+12);else{const p=s.split('-').map(Number),t=p[1]-1+(f=='quarterly'?3:1),y=p[0]+Math.floor(t/12),mo=t%12,last=new Date(Date.UTC(y,mo+1,0)).getUTCDate(),dd=Math.min(dom>0&&dom<32?dom:p[2],last);return y+'-'+String(mo+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}return d.toISOString().slice(0,10)}
let tab='today';const T=[['today','Today'],['spend','Spend'],['bills','Bills'],['money','Money'],['goals','Goals'],['debts','Debts'],['pause','Pause'],['dump','Brain dump'],['backup','Backup']];
function render(){$('nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';editB=editD=delD=null;bkMsg='';render()">${t[1]}</button>`).join('');$('v').innerHTML=V[tab]();$('demo').innerHTML=demoBar();save()}
const accSel=id=>S.bal.length<2?'':`<select id="${id}" style="width:auto;max-width:170px" aria-label="Account">${S.bal.map(a=>`<option value="${a.id}"${a.id==first().id?' selected':''}>${esc(a.name)}</option>`).join('')}</select>`;
const catSel=(id,sel)=>`<select id="${id}">${CATS.map(c=>`<option${c==sel?' selected':''}>${c}</option>`).join('')}</select>`;
const V={};
V.today=()=>{const c=calc(),sp=S.exp.filter(e=>e.d==td()).reduce((s,e)=>s+e.amt,0),up=S.bills.filter(b=>!b.paid).sort((a,b)=>a.due>b.due?1:-1).slice(0,3);
return`<div class="card hero"><small>Safe to spend today</small>${c.past?`<h1 style="color:var(--warn);font-size:30px">Update your payday</h1><div class="m">${m(c.safe)} free · your payday date has passed</div><button class="p" onclick="tab='money';editB=editD=delD=null;render()">Update payday</button><div><small>The daily guide is hidden until you do, because it would be misleading. Bills and days left may also be out of date.</small></div>`:`<h1 class="${c.per<0?'neg':''}">${m(c.per)}</h1><div class="m">${m(c.safe)} free · ${c.d} day${c.d>1?'s':''} to payday${S.payday?'':' (set payday in Money)'}</div>`}
<details><summary>See calculation</summary><table><tr><td>Included balances</td><td>${m(c.bal)}</td></tr><tr><td>− Bills before payday</td><td>${m(c.bills)}</td></tr><tr><td>− Protected savings</td><td>${m(c.prot)}</td></tr><tr><td>− Buffer</td><td>${m(c.buf)}</td></tr><tr><td><b>= Safe to spend</b></td><td><b>${m(c.safe)}</b></td></tr><tr><td>÷ Days left</td><td>${c.past?'payday passed':c.d}</td></tr></table><small>An organising estimate based on what you enter, not a guarantee.</small></details></div>
<div class="card"><h3>Quick log <small>· spent today ${m(sp)}</small></h3><input id="q" type="number" step="0.01" min="0.01" placeholder="Amount"><div class="chips r">${[5,10,20,50].map(n=>`<button onclick="$('q').value=${n}">${esc(S.cur)}${n}</button>`).join('')}</div><div class="r">${catSel('qc')}${accSel('qac')}<input id="qn" placeholder="Note (optional)"></div><button class="p" onclick="addExp('q','qc','qn',null,'qac')">Log it</button></div>
<div class="card"><h3>Can this fit?</h3><div class="r"><input id="cf" type="number" step="0.01" placeholder="Price"><button class="s" onclick="fit()">Check</button></div><div id="cfr" class="m">Nothing is recorded.</div></div>
<div class="card"><h3>Coming up</h3>${up.map(b=>`<div class="row"><span>${esc(b.name)} <small>${esc(b.due)}</small></span><b>${m(b.amt)}</b></div>`).join('')||'<small>No bills yet.</small>'}</div>`};
function fit(){const a=num('cf'),c=calc();$('cfr').innerHTML=!a?'Enter a price.':c.past?(a<=c.safe?'<b>Fits your safe-to-spend.</b> Update your payday for an accurate daily guide.':`<b class="bad">Over by ${m(a-c.safe)}.</b> Update your payday for an accurate picture.`):a<=c.per?`<b class="ok">Fits today's guide</b> – leaves ${m(c.per-a)} for today.`:a<=c.safe?`<b>Fits your safe-to-spend</b>, but uses about ${(a/Math.max(c.per,.01)).toFixed(1)} days of spending.`:`<b class="bad">Over by ${m(a-c.safe)}.</b> Consider the Pause list.`}
function addExp(a,c,n,d,sel){const x=amt(a);if(x===null)return;const e=sel&&$(sel),ac=S.bal.length==1?S.bal[0]:(e?S.bal.find(b=>String(b.id)==e.value):null);
if(!ac){alert('Please choose which account this expense came from. Nothing was saved.');return}
if(!demoUse())return;S.exp.unshift({id:uid(),d:d?val(d):td(),amt:x,cat:val(c),note:val(n),accountId:ac.id});ac.amt-=x;render()}
V.spend=()=>`<div class="card"><h3>Add expense</h3><div class="r"><input id="ea" type="number" step="0.01" min="0.01" placeholder="Amount"><input id="ed" type="date" value="${td()}">${catSel('ec')}${accSel('eac')}</div><input id="en" placeholder="Note"><button class="p" onclick="addExp('ea','ec','en','ed','eac')">Save</button></div>
<div class="card"><h3>Spending by category (this list)</h3>${CATS.map(c=>{const t=S.exp.filter(e=>e.cat==c).reduce((s,e)=>s+e.amt,0);return t?`<div class="row"><span>${c}</span><b>${m(t)}</b></div>`:''}).join('')||'<small>Nothing yet.</small>'}</div>
${budgetCard()}<div class="card"><h3>Recent</h3>${S.exp.slice(0,40).map(e=>`<div class="row"><span>${esc(e.d)} · ${esc(e.cat)} <small>${esc(e.note||'')}</small>${S.bal.length>1?` <small>· ${esc((S.bal.find(b=>b.id==e.accountId)||{name:'account not linked'}).name)}</small>`:''}</span><span><b>${m(e.amt)}</b> <button class="s"${refBusy()?' disabled':''} onclick="delExp(${e.id},event)">Refund/remove</button></span></div>`).join('')||'<small>No expenses yet.</small>'}</div>`;
const REF_LOCK_MS=1000,refSt={},refBusy=()=>refSt.t!==undefined&&performance.now()-refSt.t<REF_LOCK_MS;
function delExp(i,ev){if(refBusy()||(refSt.armed&&ev&&ev.detail>1))return;refSt.armed=false;const e=S.exp.find(x=>x.id==i);if(!e)return;
const ac=e.accountId===undefined||e.accountId===null?null:S.bal.find(b=>b.id==e.accountId);
if(ac)ac.amt+=e.amt;
else if(!confirm('This expense has no linked account (it was saved before accounts were tracked, or its account no longer exists).\n\nRemoving it will NOT change any account balance. You can adjust a balance yourself in the Money tab.\n\nRemove it anyway?'))return;
if(e.billId!==undefined&&e.billDueBefore!==undefined){
  const b=S.bills.find(x=>x.id==e.billId);
  if(b){
    const newerPayment=S.exp.some(x=>x.id>e.id&&x.billId===e.billId);
    if(!newerPayment){
      if(b.f=='once'){
        if(e.billPaidBefore!==undefined)b.paid=!!e.billPaidBefore;
      }else if(b.due!==e.billDueBefore){
        const expectedNext=nextDue(e.billDueBefore,b.f,b.dom);
        if(b.due===expectedNext)b.due=e.billDueBefore;
      }
    }
  }
}
S.exp=S.exp.filter(x=>x.id!=i);refSt.t=performance.now();refSt.armed=true;setTimeout(()=>document.querySelectorAll('#v button[disabled]').forEach(x=>{if((x.getAttribute('onclick')||'').startsWith('delExp(')&&!refBusy())x.disabled=false}),REF_LOCK_MS+20);render()}
V.bills=()=>{const e=editB&&S.bills.find(x=>x.id==editB),ty=e&&isSub(e)?'sub':'bill',sl=(a,b)=>a==b?' selected':'',
list=S.bills.filter(b=>!b.paid&&({all:1,bill:!isSub(b),sub:isSub(b),soon:b.due<=soon()})[bfl]).sort((a,b)=>a.due>b.due?1:-1);
return`<div class="card"><h3>${e?'Edit':'Add'} bill or subscription</h3><div class="r"><input id="bn" placeholder="Name" value="${e?esc(e.name):''}"><input id="ba" type="number" step="0.01" min="0.01" placeholder="Amount" value="${e?esc(e.amt):''}"><input id="bd" type="date" value="${e?esc(e.due):td()}"><select id="bf">${[['once','One-off'],['weekly','Weekly'],['fortnight','Every 2 weeks'],['monthly','Monthly'],['quarterly','Every 3 months'],['yearly','Yearly']].map(o=>`<option value="${o[0]}"${sl(o[0],e?e.f:'monthly')}>${o[1]}</option>`).join('')}</select><select id="bty" onchange="$('subx').style.display=this.value=='sub'?'':'none'"><option value="bill"${sl(ty,'bill')}>Regular bill</option><option value="sub"${sl(ty,'sub')}>Subscription</option></select></div><div id="subx" class="r" style="display:${ty=='sub'?'':'none'}">${catSel('bc',e&&e.cat||'Subscriptions')}<input id="bnote" placeholder="Note (optional)" value="${e?esc(e.note||''):''}"></div><button class="p" onclick="addBill()">${e?'Save':'Add'}</button>${e?' <button class="s" onclick="editB=null;render()">Cancel</button>':''}</div>
<div class="chips r" style="margin-bottom:12px">${[['all','All'],['bill','Bills'],['sub','Subscriptions'],['soon','Due soon']].map(o=>`<button class="${bfl==o[0]?'on':''}" onclick="bfl='${o[0]}';render()">${o[1]}</button>`).join('')}</div>

${S.debts.map(d=>{const p=d.orig>0?Math.max(0,Math.min(100,(d.orig-d.bal)/d.orig*100)):null;return`<div class="card"><div class="row" style="border:0;padding:0"><b>${esc(d.name)}</b><b>Remaining: ${m(d.bal)}</b></div>${p===null?'<small>Add an original balance to see progress.</small>':`<div class="bar" style="margin:6px 0"><i style="width:${p}%"></i></div><small>Progress: ${Math.round(p)}%</small>`}<div class="m">Minimum payment: ${m(d.min)}${d.pay?' · Planned: '+m(d.pay):''}<br>Next payment: ${d.next?fd(d.next):'not set'}${d.rate?' · Interest '+esc(d.rate)+'%':''}</div><div class="r" style="margin-top:8px"><input id="dp${d.id}" type="number" step="0.01" min="0.01" placeholder="Payment amount" value="${esc(d.pay||d.min||'')}"><button class="s" onclick="payDebt(${d.id},event)">Record payment</button></div>${d.next?`<label class="m"><input type="checkbox" id="da${d.id}" style="width:auto" checked> Move next payment date forward 1 month</label><br>`:''}<button class="s" onclick="editD=${d.id};render();scrollTo(0,0)">Edit</button> <button class="s" onclick="delDebt(${d.id})">${delD==d.id?'Tap again to delete':'Delete'}</button>${(d.hist||[]).slice(-3).map(h=>`<div class="m">${esc(h)}</div>`).join('')}</div>`}).join('')}
<div class="card"><details ${!S.debts.length||e?'open':''}><summary>${e?'Edit debt':'Add a debt'}</summary><small>Tracking only. Payments here don't change your account balances.</small><div class="r"><label class="m">Debt name<input id="dbn" value="${e?esc(e.name):''}"></label><label class="m">Current balance<input id="dbb" type="number" step="0.01" value="${e?esc(e.bal):''}"></label><label class="m">Original balance (optional)<input id="dbo" type="number" step="0.01" value="${f('orig')}"></label><label class="m">Interest rate % (optional)<input id="dbr" type="number" step="0.01" value="${f('rate')}"></label><label class="m">Minimum payment<input id="dbm" type="number" step="0.01" value="${f('min')}"></label><label class="m">Planned payment amount<input id="dbp" type="number" step="0.01" value="${f('pay')}"></label><label class="m">Next payment date<input id="dbd" type="date" value="${e?esc(e.next||''):''}"></label></div><button class="p" onclick="saveDebt()">${e?'Save changes':'Add debt'}</button>${e?' <button class="s" onclick="editD=null;render()">Cancel</button>':''}</details></div>`};
function saveDebt(){if(!val('dbn')){alert('Please enter a debt name. Nothing was saved.');return}if(isNaN(parseFloat(val('dbb')))){alert('Please enter the current balance as a number, for example 250. Nothing was saved.');return}const o={name:val('dbn'),bal:Math.max(0,num('dbb')),orig:num('dbo'),rate:num('dbr'),min:num('dbm'),pay:num('dbp'),next:val('dbd')};
if(o.orig>0&&o.bal>o.orig){alert('The current balance can’t be higher than the original balance. Please check the numbers.');return}
if(editD){Object.assign(S.debts.find(x=>x.id==editD),o);editD=null}else{if(!demoUse())return;S.debts.push(Object.assign({id:uid(),hist:[]},o))}render()}
const DPAY_LOCK_MS=1000,dPaySt={};
function payDebt(i,ev){const n=performance.now();if((dPaySt.t!==undefined&&n-dPaySt.t<DPAY_LOCK_MS)||(dPaySt.armed&&ev&&ev.detail>1))return;const d=S.debts.find(x=>x.id==i),a=Math.round(num('dp'+i)*100)/100;if(!d||!(a>0)||!Number.isFinite(a)){alert('Please enter a payment amount above 0.');return}
if(!(d.bal>0)){alert('This debt is already paid off.');return}
if(!demoUse())return;dPaySt.t=n;dPaySt.armed=true;const ap=Math.round(Math.min(a,d.bal)*100)/100;d.bal=Math.max(0,Math.round((d.bal-ap)*100)/100);(d.hist=d.hist||[]).push(td()+' paid '+m(ap)+(ap<a?' (balance cleared)':''));const c=$('da'+i);if(d.next&&c&&c.checked)d.next=nextDue(d.next,'monthly');render()}
function delDebt(i){if(delD==i){S.debts=S.debts.filter(x=>x.id!=i);delD=null}else delD=i;render()}
for(const k of['bal','exp','bills','inc','goals','pause','dump','debts','categoryBudgets'])S[k].forEach(x=>{if(x&&typeof x=='object'&&!(typeof x.id=='number'&&isFinite(x.id)))x.id=uid()});
let demoMsg='';
function demoUse(){if(nz(S.demoUsed)>=DEMO_LIMIT){demoMsg='You’ve used all '+DEMO_LIMIT+' demo entries. Adding more is available in the full Calm Cash Planner, or tap Reset Demo to start the sample again.';render();scrollTo(0,0);return false}S.demoUsed=nz(S.demoUsed)+1;return true}
function demoLocked(){demoMsg='This feature is available in the full Calm Cash Planner.';render();scrollTo(0,0)}
function demoCta(){return`<a class="dcta" href="${ETSY_OK?esc(ETSY_URL):'#'}" target="_blank" rel="noopener" onclick="if(!ETSY_OK){alert('The purchase link isn’t available yet.');return false}">Get the full planner on Etsy</a>`}
function demoBar(){const left=Math.max(0,DEMO_LIMIT-nz(S.demoUsed)),msg=demoMsg;demoMsg='';
return`<div class="dbar"><div class="dt">CALM CASH — FREE DEMO</div><p>You’re viewing the free demo. Purchase the full Calm Cash Planner to unlock the complete planner.</p><p class="dnote">Demo data only — these numbers are examples and are not your personal financial records.</p>${msg?`<div class="dmsg"><b>${esc(msg)}</b></div>`:''}<div class="dact"><small class="${left<=5?'low':''}">Demo entries left: <b>${left} of ${DEMO_LIMIT}</b></small><span><button class="s" onclick="resetDemo()">Reset Demo</button> ${demoCta()}</span></div></div>`}
function resetDemo(){if(!confirm('Reset the demo?\n\nAll sample data goes back to how it started, and your demo entries are refilled.'))return;S=mig(demoSeed());tab='today';editB=editD=delD=null;bkMsg='';incMsg='';demoMsg='';render();scrollTo(0,0)}
render();
</script></body></html>
